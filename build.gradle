// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = "1.9.21"
    ext{
        version_android_gradle_plugin = '4.0.1'
        version_core = "1.3.1"
        version_constraint_layout = "1.1.3"
        version_glide = "4.8.0"
        version_kotlin = "1.4.30"
        version_lifecycle = "2.2.0"
        version_moshi = "1.9.3"
        version_navigation = "1.0.0"
        version_retrofit = "2.9.0"
        version_recyclerview = "1.0.0"
        room_version = "2.6.1"
        version_coroutines = "1.0.1"
        version_mdc = "1.4.0-alpha01"
        version_paging = "3.2.1"
        version_koin = '3.5.3'
        version_compose = '1.5.4'
        version_compose_minor = '1.3.0-alpha03'
        version_decompose = '2.2.3'
        version_decompose_ext = "3.0.0"

        //Test implementations
        version_mockk = '1.10.6'
        version_junit = '4.13.2'
        version_ext_junit = '1.1.2'
        version_coroutines_test = '1.4.3'
        version_core_testing = '2.1.0'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:2.7.6"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}